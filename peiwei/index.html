<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pei Wei | Ads Dashboard</title>
<style>
  :root {
    --red: #c8102e; --gold: #e8a020; --dark: #1a1a2e; --darker: #12121e;
    --card: #1e1e30; --border: #2a2a40; --text: #e8e8f0; --muted: #888;
    --green: #22c55e; --yellow: #f59e0b; --orange: #ef4444;
    --blue: #38bdf8; --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--darker); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
  .header { background: linear-gradient(135deg, var(--dark) 0%, #1a1a3e 100%); border-bottom: 2px solid var(--red); padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; }
  .header-logo { display: flex; align-items: center; gap: 14px; }
  .header-logo-icon { width: 44px; height: 44px; background: var(--red); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; }
  .header-title { font-size: 22px; font-weight: 700; color: #fff; }
  .header-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .header-meta { text-align: right; }
  .header-date { font-size: 13px; color: var(--gold); font-weight: 600; }
  .header-updated { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .container { max-width: 1440px; margin: 0 auto; padding: 24px 32px; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin: 32px 0 14px; border-left: 3px solid var(--red); padding-left: 12px; }
  .badge-manual { display: inline-block; font-size: 9px; background: #333; color: var(--muted); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
  .badge-live   { display: inline-block; font-size: 9px; background: #1a3a1a; color: var(--green); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .table-header { padding: 14px 20px; background: #252535; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .table-header-title { font-size: 14px; font-weight: 700; color: #fff; }
  .table-header-sub { font-size: 11px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 10px 14px; text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); background: #1a1a2c; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #252535; }
  tbody td { padding: 10px 14px; text-align: right; font-size: 13px; }
  tbody td:first-child { text-align: left; font-weight: 500; }
  .tr-total { background: #252535 !important; }
  .tr-total td { font-weight: 700; color: #fff; border-top: 1px solid var(--border); }
  .tr-subtotal { background: #1e2030 !important; }
  .tr-subtotal td { font-weight: 600; font-style: italic; border-top: 1px dashed var(--border); color: #c0c0d8; }
  .positive { color: var(--green); }
  .negative { color: var(--orange); }
  .neutral  { color: var(--yellow); }
  .dimmed   { color: var(--muted); font-size: 11px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; }
  .kpi-value { font-size: 20px; font-weight: 700; color: #fff; }
  .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .month-progress { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; margin-bottom: 24px; }
  .month-progress-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .month-progress-label { font-size: 13px; font-weight: 600; color: #fff; }
  .month-progress-days { font-size: 12px; color: var(--muted); }
  .month-bar-wrap { background: #2a2a3e; border-radius: 8px; height: 10px; overflow: hidden; }
  .month-bar { background: linear-gradient(90deg, var(--red), var(--gold)); height: 100%; border-radius: 8px; }
  .alert { border-radius: 10px; padding: 12px 16px; font-size: 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
  .alert.warning { background: #2a1a00; border: 1px solid #5a3a00; color: #f59e0b; }
  .alert.info    { background: #001a2a; border: 1px solid #004466; color: #38bdf8; }
  .alert.danger  { background: #2a0000; border: 1px solid #660000; color: #ef4444; }
  .alert-icon { font-size: 16px; flex-shrink: 0; }
  .brand-split-wrap { display: flex; align-items: center; gap: 10px; }
  .brand-split-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; flex: 1; min-width: 80px; }
  .brand-split-seg { height: 100%; }
  .seg-nonbrand { background: var(--blue); }
  .seg-brand    { background: var(--purple); }
  .seg-rmk      { background: var(--gold); }
  .brand-split-legend { display: flex; gap: 10px; font-size: 10px; flex-wrap: wrap; margin-top: 6px; }
  .bsl-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  .footer { text-align: center; padding: 24px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); margin-top: 32px; }
  @media (max-width: 768px) { .container { padding: 16px; } .header { padding: 16px; flex-direction: column; gap: 12px; text-align: center; } }
</style><style>
.sec-title{font-size:15px;font-weight:600;margin:28px 0 10px;color:var(--text);letter-spacing:.2px}
.sub-title{font-size:13px;font-weight:600;margin:22px 0 8px;color:var(--gold);letter-spacing:.3px}
.sec-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:8px}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbl-wrap th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:500;font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl-wrap td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr.tr-total td{font-weight:600;background:rgba(255,255,255,.03)}
</style>
<body>
<div class="container">
  <div class="header">
    <div class="header-logo"><span class="header-logo-icon">PW</span></div>
    <div class="header-title">Pei Wei &mdash; Paid Media</div>
    <div class="header-subtitle">Monthly pacing &amp; performance</div>
    <div class="header-updated" id="last-updated">Cargando&hellip;</div>
  </div>

  <div class="month-progress">
    <div class="month-progress-label" id="month-label">&nbsp;</div>
    <div class="month-progress-days" id="days-remaining">&nbsp;</div>
    <div class="month-bar-wrap"><div class="month-bar" id="month-bar" style="width:0%"></div></div>
  </div>

  <h2 class="sec-title">Pacing por canal</h2>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Canal</th><th>Budget</th><th>Spend</th><th>% budget</th><th>% del mes</th>
        <th>Restante</th><th>Proyección</th><th>Conv.</th><th>ROAS</th><th>Estado</th>
      </tr></thead>
      <tbody id="pacing-tbody"></tbody>
    </table>
  </div>

  <h2 class="sec-title">Métricas semanales &mdash; agosto</h2>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Semana</th><th>Spend</th><th>Impresiones</th><th>Clicks</th>
        <th>CTR</th><th>CPC</th><th>Conv.</th><th>Revenue</th><th>ROAS</th>
      </tr></thead>
      <tbody id="weekly-tbody"></tbody>
    </table>
  </div>
  <div class="sec-note" id="weekly-note"></div>

  <h2 class="sec-title">Spend por plataforma y semana</h2>
  <div class="tbl-wrap"><table><thead id="matrix-thead"></thead><tbody id="matrix-tbody"></tbody></table></div>

  <h2 class="sec-title">Detalle por canal</h2>
  <div id="canales"></div>

  <div class="footer">Pei Wei &middot; <span id="footer-date"></span></div>
</div>

<script>
const fmtUSD = (n) => n == null ? '&mdash;' : '$' + Math.round(n).toLocaleString('en-US');
const fmtNum = (n) => n == null ? '&mdash;' : Math.round(n).toLocaleString('en-US');
const pct    = (n) => n == null ? '&mdash;' : (n * 100).toFixed(1) + '%';

// Semáforo de pacing: se compara cuánto del budget se gastó contra cuánto del
// mes transcurrió. Ese cociente es lo que dice si vas rápido o lento, no el
// gasto absoluto.
function estado(ratio) {
  if (ratio == null) return ['&mdash;', 'var(--muted)', 'transparent'];
  if (ratio < 0.85) return ['UNDERPACING', 'var(--yellow)', '#3a2a00'];
  if (ratio > 1.15) return ['OVERPACING', 'var(--red)', '#3a1a1a'];
  return ['ON PACE', 'var(--green)', '#1a3a1a'];
}

function renderPacing(d) {
  const share = d.daysElapsed / d.daysInMonth;
  let totB = 0, totS = 0, totC = 0;
  const filas = (d.channels || []).map((c) => {
    const sinDato = (d.unavailable || []).includes(c.name);
    const pctB = c.budget ? c.spend / c.budget : null;
    const ratio = (c.budget && share) ? (c.spend / c.budget) / share : null;
    const proy  = share ? c.spend / share : null;
    const roas  = c.spend ? c.revenue / c.spend : null;
    totB += c.budget || 0; totS += c.spend || 0; totC += c.conv || 0;
    if (sinDato) return `<tr><td><strong>${c.name}</strong><span class="badge-manual" style="margin-left:6px">SIN CONECTOR</span></td>
      <td>${fmtUSD(c.budget)}</td><td colspan="8" style="color:var(--muted)">sin datos &mdash; no hay conector para este canal</td></tr>`;
    const [txt, col, bg] = estado(ratio);
    return `<tr>
      <td><strong>${c.name}</strong><span class="badge-live" style="margin-left:6px">&#9679; LIVE</span></td>
      <td>${fmtUSD(c.budget)}</td><td>${fmtUSD(c.spend)}</td>
      <td>${pct(pctB)}</td><td>${pct(ratio)}</td>
      <td>${fmtUSD((c.budget || 0) - (c.spend || 0))}</td><td>${fmtUSD(proy)}</td>
      <td>${fmtNum(c.conv)}</td><td><strong>${roas ? roas.toFixed(1) + 'x' : '&mdash;'}</strong></td>
      <td><span style="background:${bg};color:${col};border-radius:4px;padding:2px 8px;font-size:11px;">${txt}</span></td>
    </tr>`;
  });
  filas.push(`<tr class="tr-total"><td>TOTAL</td><td>${fmtUSD(totB)}</td><td>${fmtUSD(totS)}</td>
    <td>${pct(totB ? totS / totB : null)}</td><td colspan="3">&mdash;</td><td>${fmtNum(totC)}</td><td colspan="2">&mdash;</td></tr>`);
  document.getElementById('pacing-tbody').innerHTML = filas.join('');
}

function renderSemanal(d) {
  const w = d.weekly;
  const tb = document.getElementById('weekly-tbody');
  if (!w || !w.semanas || !w.semanas.length) {
    tb.innerHTML = '<tr><td colspan="9" style="color:var(--muted)">sin datos semanales</td></tr>';
    return;
  }
  const dia = (s) => { const [, m, x] = s.split('-'); return `${x}/${m}`; };
  tb.innerHTML = w.semanas.map((s) => {
    // Se suma sobre los canales de la semana. conv y revenue pueden venir en
    // null cuando la atribucion todavia no cerro: si NINGUN canal reporto, la
    // celda queda vacia en vez de mostrar un cero que se lee como caida.
    const ch = Object.values(s.canales || {});
    const spend  = ch.reduce((a, c) => a + (c.spend || 0), 0);
    const impr   = ch.reduce((a, c) => a + (c.impr || 0), 0);
    const clicks = ch.reduce((a, c) => a + (c.clicks || 0), 0);
    const conv = ch.some((c) => c.conv != null) ? ch.reduce((a, c) => a + (c.conv || 0), 0) : null;
    const rev  = ch.some((c) => c.revenue != null) ? ch.reduce((a, c) => a + (c.revenue || 0), 0) : null;
    return `<tr>
      <td><strong>${dia(s.desde)} &ndash; ${dia(s.hasta)}</strong>${s.parcial ? ' <span class="badge-manual">PARCIAL</span>' : ''}</td>
      <td>${fmtUSD(spend)}</td><td>${fmtNum(impr)}</td><td>${fmtNum(clicks)}</td>
      <td>${impr ? ((clicks / impr) * 100).toFixed(2) + '%' : '&mdash;'}</td>
      <td>${clicks ? '$' + (spend / clicks).toFixed(2) : '&mdash;'}</td>
      <td>${fmtNum(conv)}</td><td>${fmtUSD(rev)}</td>
      <td><strong>${rev && spend ? (rev / spend).toFixed(1) + 'x' : '&mdash;'}</strong></td>
    </tr>`;
  }).join('');
  const parcial = w.semanas.some((s) => s.parcial);
  document.getElementById('weekly-note').innerHTML =
    'Google + Meta combinados. Los cortes semanales son los de Meta (1&ndash;7, 8&ndash;14, 15&ndash;21&hellip;).'
    + (parcial ? ' La última semana está en curso: Meta todavía no reporta conversiones ni revenue de esos días, la atribución llega con retraso.' : '');
}

// Matriz spend canal x semana. Es la vista que responde "donde se fue la plata
// esta semana" de un vistazo, sin abrir canal por canal.
function renderMatriz(d) {
  const w = d.weekly;
  if (!w || !w.semanas) return;
  const canales = [...new Set(w.semanas.flatMap((s) => Object.keys(s.canales || {})))];
  document.getElementById('matrix-thead').innerHTML =
    '<tr><th>Semana</th>' + canales.map((c) => `<th>${c}</th>`).join('') + '<th>Total</th></tr>';
  const dia = (x) => { const [, m, y] = x.split('-'); return `${y}/${m}`; };
  const filas = w.semanas.map((s) => {
    let tot = 0;
    const celdas = canales.map((c) => { const v = s.canales?.[c]?.spend || 0; tot += v; return `<td>${fmtUSD(v)}</td>`; });
    return `<tr><td><strong>${dia(s.desde)} &ndash; ${dia(s.hasta)}</strong>${s.parcial ? ' <span class="badge-manual">PARCIAL</span>' : ''}</td>${celdas.join('')}<td><strong>${fmtUSD(tot)}</strong></td></tr>`;
  });
  const totCol = canales.map((c) => w.semanas.reduce((a, s) => a + (s.canales?.[c]?.spend || 0), 0));
  filas.push(`<tr class="tr-total"><td>TOTAL MTD</td>${totCol.map((v) => `<td>${fmtUSD(v)}</td>`).join('')}<td>${fmtUSD(totCol.reduce((a, b) => a + b, 0))}</td></tr>`);
  document.getElementById('matrix-tbody').innerHTML = filas.join('');
}

// Por cada canal: su evolucion semanal y sus campanas. Es el nivel donde se ve
// que campana esta traccionando y cual esta quemando presupuesto.
function renderCanales(d) {
  const w = d.weekly;
  if (!w || !w.semanas) return;
  const canales = [...new Set(w.semanas.flatMap((s) => Object.keys(s.canales || {})))];
  const dia = (x) => { const [, m, y] = x.split('-'); return `${y}/${m}`; };
  const fila = (o, etiqueta, extra) => {
    const roas = o.spend && o.revenue != null ? (o.revenue / o.spend).toFixed(1) + 'x' : '&mdash;';
    return `<tr><td>${etiqueta}</td>${extra || ''}<td>${fmtUSD(o.spend)}</td><td>${fmtNum(o.impr)}</td><td>${fmtNum(o.clicks)}</td>
      <td>${o.impr ? ((o.clicks / o.impr) * 100).toFixed(2) + '%' : '&mdash;'}</td>
      <td>${o.clicks ? '$' + (o.spend / o.clicks).toFixed(2) : '&mdash;'}</td>
      <td>${fmtNum(o.conv)}</td><td>${fmtUSD(o.revenue)}</td><td><strong>${roas}</strong></td></tr>`;
  };
  const cab = '<tr><th>Semana</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>CPC</th><th>Conv.</th><th>Revenue</th><th>ROAS</th></tr>';
  const cabC = '<tr><th>Campaña</th><th>% del canal</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>CPC</th><th>Conv.</th><th>Revenue</th><th>ROAS</th></tr>';
  document.getElementById('canales').innerHTML = canales.map((c) => {
    const semanas = w.semanas.filter((s) => s.canales?.[c]).map((s) =>
      fila(s.canales[c], `<strong>${dia(s.desde)} &ndash; ${dia(s.hasta)}</strong>${s.parcial ? ' <span class="badge-manual">PARCIAL</span>' : ''}`));
    const camps = (w.campanas?.[c] || []);
    const totC = camps.reduce((a, x) => a + x.spend, 0);
    const filasC = camps.map((x) => fila(x, x.name, `<td>${totC ? ((x.spend / totC) * 100).toFixed(1) + '%' : '&mdash;'}</td>`));
    return `<h3 class="sub-title">${c}</h3>
      <div class="tbl-wrap"><table><thead>${cab}</thead><tbody>${semanas.join('')}</tbody></table></div>
      ${camps.length ? `<div class="tbl-wrap" style="margin-top:8px"><table><thead>${cabC}</thead><tbody>${filasC.join('')}</tbody></table></div>` : ''}`;
  }).join('');
}

fetch('data.json?v=' + Date.now())
  .then((r) => r.json())
  .then((d) => {
    const gen = new Date(d.generatedAt);
    document.getElementById('last-updated').textContent =
      'Actualizado: ' + gen.toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    document.getElementById('month-label').innerHTML =
      `${d.monthLabel} &mdash; día <strong>${d.daysElapsed}</strong> de <strong>${d.daysInMonth}</strong>`;
    document.getElementById('days-remaining').textContent =
      `${d.daysInMonth - d.daysElapsed} días restantes`;
    document.getElementById('month-bar').style.width = (d.daysElapsed / d.daysInMonth * 100).toFixed(0) + '%';
    // El titulo se arma desde los datos: hardcodearlo es como quedo clavado en
    // "July 2026" mientras el dashboard ya mostraba agosto.
    document.title = `Pei Wei | Ads Dashboard – ${d.monthLabel}`;
    renderPacing(d);
    renderSemanal(d);
    renderMatriz(d);
    renderCanales(d);
    document.getElementById('footer-date').textContent = gen.toLocaleDateString('en-US');
  })
  .catch((e) => {
    document.getElementById('last-updated').textContent = 'No pude cargar data.json: ' + e.message;
  });
</script>
</body>
</html>
