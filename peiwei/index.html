<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pei Wei | Ads Dashboard</title>
<style>
  :root {
    --red:#c8102e; --gold:#e8a020; --dark:#1a1a2e; --darker:#12121e;
    --card:#1e1e30; --border:#2a2a40; --text:#e8e8f0; --muted:#888;
    --green:#22c55e; --yellow:#f59e0b; --orange:#ef4444; --blue:#38bdf8; --purple:#a78bfa;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--darker); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; }
  .header { background:linear-gradient(135deg,var(--dark),#1a1a3e); border-bottom:2px solid var(--red); padding:20px 32px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .header-logo { display:flex; align-items:center; gap:14px; }
  .header-logo-icon { width:44px; height:44px; background:var(--red); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:900; color:#fff; }
  .header-title { font-size:22px; font-weight:700; color:#fff; }
  .header-subtitle { font-size:12px; color:var(--muted); margin-top:2px; }
  .header-meta { text-align:right; }
  .header-updated { font-size:12px; color:var(--gold); font-weight:600; }
  .header-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:5px; }
  .container { max-width:1440px; margin:0 auto; padding:24px 32px; }
  .section-title { font-size:15px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:1px; margin:30px 0 14px; border-left:3px solid var(--red); padding-left:12px; }
  .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:16px; }
  .table-scroll { overflow-x:auto; }
  .table-header { padding:13px 18px; background:#252535; border-bottom:1px solid var(--border); font-size:13px; font-weight:700; color:#fff; }
  table { width:100%; border-collapse:collapse; min-width:640px; }
  thead th { padding:10px 12px; text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); background:#1a1a2c; border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th:first-child { text-align:left; }
  tbody tr { border-bottom:1px solid var(--border); }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:#252535; }
  tbody td { padding:9px 12px; text-align:right; font-size:12.5px; white-space:nowrap; }
  tbody td:first-child { text-align:left; font-weight:500; }
  .tr-total { background:#252535 !important; }
  .tr-total td { font-weight:700; color:#fff; border-top:1px solid var(--border); }
  .pos { color:var(--green); } .neg { color:var(--orange); } .neu { color:var(--yellow); }
  .pill { border-radius:5px; padding:2px 8px; font-size:10.5px; font-weight:600; }
  .pill-green { background:#1a3a1a; color:var(--green); } .pill-yellow { background:#3a2a00; color:var(--yellow); } .pill-red { background:#3a0000; color:var(--orange); }
  .month-progress { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px 22px; margin-bottom:8px; }
  .month-progress-top { display:flex; justify-content:space-between; margin-bottom:9px; flex-wrap:wrap; gap:6px; }
  .month-progress-label { font-size:13px; font-weight:600; color:#fff; }
  .month-progress-days { font-size:12px; color:var(--muted); }
  .month-bar-wrap { background:#2a2a3e; border-radius:8px; height:9px; overflow:hidden; }
  .month-bar { background:linear-gradient(90deg,var(--red),var(--gold)); height:100%; border-radius:8px; }
  .kpi-strip { padding:14px 18px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media(max-width:640px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } table{ min-width:520px; } }
  .kpi { background:#181828; border:1px solid var(--border); border-radius:8px; padding:9px 11px; }
  .kpi-label { font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:3px; }
  .kpi-value { font-size:17px; font-weight:700; color:#fff; }
  .kpi-sub { font-size:10px; color:var(--muted); margin-top:1px; }
  .ch-head { display:flex; justify-content:space-between; align-items:center; padding:13px 18px; background:#252535; border-bottom:1px solid var(--border); }
  .ch-name { font-size:14px; font-weight:700; color:#fff; }
  .ch-spend { font-size:13px; color:var(--gold); font-weight:600; }
  .alert { border-radius:10px; padding:12px 16px; font-size:12px; margin-bottom:10px; display:flex; gap:10px; }
  .alert.info { background:#001a2a; border:1px solid #004466; color:var(--blue); }
  .alert.warning { background:#2a1a00; border:1px solid #5a3a00; color:var(--yellow); }
  .footer { text-align:center; padding:24px; color:var(--muted); font-size:11px; border-top:1px solid var(--border); margin-top:32px; }
  .err { background:#2a0000; border:1px solid #660000; color:var(--orange); padding:16px; border-radius:10px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">
    <div class="header-logo-icon">PW</div>
    <div><div class="header-title">Pei Wei · Ads Dashboard</div>
    <div class="header-subtitle" id="subtitle">Performance &amp; Pacing</div></div>
  </div>
  <div class="header-meta"><div class="header-updated" id="updated"><span class="header-dot"></span>Loading…</div></div>
</div>
<div class="container" id="root"></div>
<div class="footer">Pei Wei Ads Dashboard · Auto-updates daily · Live: Google Ads (direct API) + Meta Ads (connector)</div>

<script>
const f$ = n => (n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const f$2 = n => "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fn = n => Math.round(n).toLocaleString("en-US");
const fp = n => (n*100).toFixed(1)+"%";
const fx = n => n>0 ? n.toFixed(1)+"x" : "—";
function paceStatus(p){ if(!p) return ['—','']; if(p>=0.9&&p<=1.15) return ['ON PACE','pill-green']; if(p>1.15) return ['OVERPACING','pill-red']; return ['UNDERPACING','pill-yellow']; }
function paceCls(p){ if(!p) return 'neu'; if(p>=0.9&&p<=1.15) return 'pos'; if(p>1.15) return 'neg'; return 'neu'; }

let DATA;
async function init(){
  const root=document.getElementById("root");
  try { const r=await fetch("data.json?t="+Date.now()); if(!r.ok) throw new Error("HTTP "+r.status); DATA=await r.json(); }
  catch(e){ document.getElementById("updated").textContent=""; root.innerHTML=`<div class="err">Could not load data.json — ${e.message}</div>`; return; }
  const gen=new Date(DATA.generatedAt);
  document.getElementById("subtitle").textContent="Performance & Pacing — "+(DATA.monthLabel||"");
  document.getElementById("updated").innerHTML=`<span class="header-dot"></span>Last updated: ${DATA.lastSyncLabel||gen.toLocaleString()}`;

  // Month progress
  const pct=Math.round(DATA.daysElapsed/DATA.daysInMonth*100);
  root.innerHTML += `<div class="month-progress">
    <div class="month-progress-top"><div class="month-progress-label">${DATA.monthLabel} — Day ${DATA.daysElapsed} of ${DATA.daysInMonth}</div>
    <div class="month-progress-days">${DATA.daysInMonth-DATA.daysElapsed} days remaining</div></div>
    <div class="month-bar-wrap"><div class="month-bar" style="width:${pct}%"></div></div></div>`;

  renderPacing(root);
  renderChannels(root);
  renderCampaigns(root, "google", "Google Ads — Campaigns MTD");
  renderCampaigns(root, "meta", "Meta Ads — Campaigns MTD");
  renderAlerts(root);
}

function renderPacing(root){
  const ch=DATA.channels||[];
  let rows="";
  ch.forEach(c=>{
    const [st,cls]=paceStatus(c.pacing);
    rows+=`<tr><td><strong>${c.name}</strong></td><td>${f$(c.budget)}</td><td>${f$(c.spend)}</td>
      <td class="${c.pctBudget>=0.9?'pos':c.pctBudget>=0.7?'neu':''}">${fp(c.pctBudget)}</td>
      <td class="${paceCls(c.pacing)}">${fp(c.pacing)}</td><td>${f$(c.budget-c.spend)}</td><td>${f$(c.projEOM)}</td>
      <td>${fn(c.conv)}</td><td><strong>${fx(c.roas)}</strong></td><td><span class="pill ${cls}">${st}</span></td></tr>`;
  });
  const t=ch.reduce((a,c)=>({budget:a.budget+c.budget,spend:a.spend+c.spend,conv:a.conv+c.conv,revenue:a.revenue+c.revenue}),{budget:0,spend:0,conv:0,revenue:0});
  rows+=`<tr class="tr-total"><td>TOTAL</td><td>${f$(t.budget)}</td><td>${f$(t.spend)}</td><td>${fp(t.spend/t.budget)}</td>
    <td>—</td><td>${f$(t.budget-t.spend)}</td><td>—</td><td>${fn(t.conv)}</td><td>${fx(t.revenue/t.spend)}</td><td>—</td></tr>`;
  root.innerHTML += `<div class="section-title">Monthly Pacing — ${DATA.monthLabel}</div>
    <div class="table-wrap"><div class="table-scroll"><table>
      <thead><tr><th>Channel</th><th>Budget</th><th>Spent MTD</th><th>% Used</th><th>Pacing</th><th>Remaining</th><th>Proj. EOM</th><th>Conv</th><th>ROAS</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

function renderChannels(root){
  root.innerHTML += `<div class="section-title">By Channel</div>`;
  (DATA.channels||[]).forEach(c=>{
    root.innerHTML += `<div class="table-wrap">
      <div class="ch-head"><div class="ch-name">${c.name}</div><div class="ch-spend">${f$(c.spend)} spent · ROAS ${fx(c.roas)}</div></div>
      <div class="kpi-strip"><div class="kpi-grid">
        ${kpi("Spend MTD",f$(c.spend),`of ${f$(c.budget)} budget`)}
        ${kpi("Impressions",fn(c.impr),"MTD")}
        ${kpi("Clicks",fn(c.clicks),"MTD")}
        ${kpi("CTR",fp(c.ctr),"")}
        ${kpi("CPC",f$2(c.cpc),"")}
        ${kpi("Conversions",fn(c.conv),c.cpa>0?"CPA "+f$2(c.cpa):"")}
        ${kpi("Revenue",f$(c.revenue),"MTD")}
        ${kpi("ROAS",fx(c.roas),"revenue / spend")}
      </div></div></div>`;
  });
}
function kpi(l,v,s){ return `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:""}</div>`; }

function renderCampaigns(root, platform, title){
  const camps=(DATA.campaigns||[]).filter(c=>c.platform===platform && c.spend>0).sort((a,b)=>b.spend-a.spend);
  if(!camps.length) return;
  const rows=camps.map(c=>{
    const ctr=c.impr>0?c.clicks/c.impr:0, cpc=c.clicks>0?c.spend/c.clicks:0, roas=c.roas||(c.spend>0?c.revenue/c.spend:0);
    return `<tr><td>${c.name}</td><td>${c.channel}</td><td>${f$(c.spend)}</td><td>${fn(c.impr)}</td><td>${fn(c.clicks)}</td>
      <td>${fp(ctr)}</td><td>${f$2(cpc)}</td><td>${fn(c.conv)}</td><td class="pos">${fx(roas)}</td></tr>`;
  }).join("");
  root.innerHTML += `<div class="section-title">${title}</div>
    <div class="table-wrap"><div class="table-scroll"><table style="min-width:720px;">
      <thead><tr><th>Campaign</th><th>Channel</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>CPC</th><th>Conv</th><th>ROAS</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

function renderAlerts(root){
  const un=DATA.unavailable||[];
  let html=`<div class="section-title">Notes</div>`;
  if(un.length) html+=`<div class="alert warning"><div>⚠️</div><div><strong>${un.join(" & ")} not connected:</strong> these channels were fed by Windsor.ai (now expired) and have no direct connector yet, so they are not shown. Everything else is live from the Google Ads and Meta APIs.</div></div>`;
  html+=`<div class="alert info"><div>ℹ️</div><div>Meta Remarketing is tracked as its own channel (campaigns named "Remarketing | …"). "All Stores | RMK" counts as Meta Ads prospecting per Juan.</div></div>`;
  root.innerHTML += html;
}
init();
</script>
</body>
</html>
