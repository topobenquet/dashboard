<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bean Watch Bonus</title>
<style>
:root{--bg:#E8ECE8;--surface:#F6F8F5;--ink:#16201B;--muted:#55645C;--line:#C5CEC7;--accent:#0E6A5A;--accent-ink:#fff;--bad:#A93A25}
@media (prefers-color-scheme: dark){:root{--bg:#101614;--surface:#18201D;--ink:#E4EBE6;--muted:#9AAAA1;--line:#2E3A35;--accent:#4DC2A5;--accent-ink:#0B1411;--bad:#EE7A63;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
#gate{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 24px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font-size:15px;margin-bottom:14px}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
button{width:100%;padding:11px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<main id="gate">
  <h1>Bean Watch Bonus</h1>
  <p>Sign in to see the weekly results.</p>
  <form id="login" autocomplete="on">
    <label for="u">User</label><input type="text" id="u" autocomplete="username" required>
    <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="rem"><input type="checkbox" id="rem" checked><label for="rem" style="margin:0;text-transform:none;letter-spacing:0;font-weight:400">Keep me signed in</label></div>
    <button id="go" type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
</main>
<script>
// The page content is encrypted (AES-256-GCM, PBKDF2 key from "user:password"), same scheme and
// stored key as /beanwatch/, so signing in to one signs in to the other.
var KEY_STORE='beanwatch-key';
var $=function(s){return document.querySelector(s)};
var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
var ENC=null;
async function loadEnc(){ if(!ENC) ENC=await (await fetch('data.enc.json?v='+Date.now())).json(); return ENC; }
async function deriveRaw(user,pass,e){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+':'+pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(e.salt),iterations:e.iter},base,256));
}
async function decrypt(raw,e){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(p){ if(!p||!p.html) throw new Error('Unexpected data format. Refresh with Cmd+Shift+R.'); document.open(); document.write(p.html); document.close(); }
(async function(){
  var saved=null; try{saved=JSON.parse(localStorage.getItem(KEY_STORE)||sessionStorage.getItem(KEY_STORE)||'null')}catch(e){}
  if(!saved){ $('#u').focus(); return; }
  try{ var e=await loadEnc(); if(saved.salt!==e.salt) throw 0; show(await decrypt(b64(saved.k),e)); }
  catch(err){ try{localStorage.removeItem(KEY_STORE);sessionStorage.removeItem(KEY_STORE)}catch(_){} }
})();
$('#login').addEventListener('submit',async function(ev){
  ev.preventDefault(); $('#err').textContent=''; $('#go').disabled=true; $('#go').textContent='Signing in...';
  try{
    var e=await loadEnc(); var raw=await deriveRaw($('#u').value.trim(),$('#pw').value,e), p;
    try{ p=await decrypt(raw,e); }catch(_){ throw new Error('Wrong user or password.'); }
    try{ var v=JSON.stringify({salt:e.salt,k:btoa(String.fromCharCode.apply(null,raw))}); ($('#rem').checked?localStorage:sessionStorage).setItem(KEY_STORE,v); }catch(_){}
    show(p);
  }catch(err){ $('#err').textContent=err.message||'Could not load data.'; $('#go').disabled=false; $('#go').textContent='Sign in'; }
});
</script>
</body>
</html>
